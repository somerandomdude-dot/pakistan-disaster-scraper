databases:
  # 1. The PostgreSQL Database
  - name: disaster-database
    databaseName: disaster_alerts
    user: admin
    plan: free

services:
  # 2. The FastAPI Backend
  - type: web
    name: disaster-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: disaster-database
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.6"
      - key: ADMIN_API_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"
