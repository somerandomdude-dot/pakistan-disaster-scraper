services:
  # 1. The PostgreSQL Database
  - type: psql
    name: disaster-database
    plan: free

  # 2. The FastAPI Backend
  - type: web
    name: disaster-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: disaster-database
          property: connectionString
      - key: ADMIN_API_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"
